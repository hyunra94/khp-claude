<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재직자 교육 관리자</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:title" content="재직자 교육 관리자">
<meta property="og:image" content="https://hyunra94.github.io/assets/og-default.png">
<meta property="og:url" content="https://hyunra94.github.io/khp-claude">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FDFCFA;
    --paper:#FFFFFF;
    --ink:#141414;
    --ink-soft:#44433D;
    --muted:#8A867D;
    --line:#141414;
    --line-soft:#C7C3B8;
    --accent:#9B2E2E;
    --success:#33513C;
    --warn:#7A5C1E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard', sans-serif;
    background:var(--bg);
    min-height:100vh;
    color:var(--ink);
  }

  /* ---------- login ---------- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{
    background:var(--paper);
    padding:40px 34px;
    width:100%;max-width:380px;
    border:1.5px solid var(--line);
  }
  .login-card .kicker{text-align:center;font-size:11px;letter-spacing:0.3em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:14px;}
  .login-card h1{font-family:'Pretendard', sans-serif;font-size:24px;margin:0 0 8px;text-align:center;}
  .login-card .sub{font-size:13.5px;color:var(--ink-soft);text-align:center;margin-bottom:28px;border-top:1px solid var(--line-soft);padding-top:12px;}
  .login-card label{
    display:block;font-size:10.5px;font-weight:700;letter-spacing:0.12em;
    text-transform:uppercase;margin:16px 0 8px;color:var(--ink-soft);
  }
  .login-card input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);
    background:#F7F5EF;font-family:inherit;font-size:15.5px;outline:none;color:var(--ink);
  }
  .login-card input:focus{border-color:var(--accent);background:#fff;}
  .login-card button{
    width:100%;margin-top:24px;padding:13px;border:none;background:var(--ink);
    color:var(--paper);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.08em;
    text-transform:uppercase;cursor:pointer;
  }
  .login-card button:hover{background:#000;}
  .login-toggle{text-align:center;margin-top:16px;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
  .login-msg{margin-top:12px;font-size:12px;color:var(--accent);text-align:center;min-height:16px;}

  /* ---------- dashboard ---------- */
  #dashboard{display:none;}
  .header{border-bottom:3px solid var(--line);padding:26px 22px 18px;}
  .header-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
  .header-inner .kicker{font-size:10.5px;letter-spacing:0.28em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
  .header-inner h1{font-family:'Pretendard', sans-serif;font-size:24px;margin:0;}
  .header-inner .who{font-size:11.5px;color:var(--ink-soft);}
  .logout-btn{
    border:1.5px solid var(--line);background:transparent;padding:9px 16px;
    font-family:inherit;font-size:11px;letter-spacing:0.06em;color:var(--ink);
    cursor:pointer;text-transform:uppercase;
  }
  .logout-btn:hover{background:var(--ink);color:var(--paper);}

  .content{padding:30px 22px 90px;}
  .panel{max-width:1180px;margin:0 auto 24px;}
  .panel h2{
    font-family:'Pretendard', sans-serif;font-size:16px;margin:0 0 18px;
    padding-bottom:8px;border-bottom:2px solid var(--line);
  }

  .add-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .add-form div{flex:1;min-width:140px;}
  .add-form label{
    display:block;font-size:10px;color:var(--ink-soft);margin-bottom:6px;
    letter-spacing:0.1em;text-transform:uppercase;font-weight:700;
  }
  .add-form input, .add-form select{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);
    background:#F7F5EF;font-family:inherit;font-size:14px;outline:none;color:var(--ink);
  }
  .add-form input:focus, .add-form select:focus{border-color:var(--accent);background:#fff;}
  .add-form button{
    padding:11px 20px;border:1.5px solid var(--line);background:transparent;color:var(--ink);
    font-family:inherit;font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;
    cursor:pointer;white-space:nowrap;
  }
  .add-form button:hover{background:var(--ink);color:var(--paper);}
  .new-type-row{margin-top:14px;}
  .new-type-row label{
    display:block;font-size:10px;color:var(--ink-soft);margin-bottom:6px;
    letter-spacing:0.1em;text-transform:uppercase;font-weight:700;
  }
  .new-type-row input{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);
    background:#F7F5EF;font-family:inherit;font-size:14px;outline:none;color:var(--ink);
  }

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;padding:9px 8px;color:var(--ink-soft);font-size:10px;text-transform:uppercase;
    letter-spacing:0.06em;border-bottom:2px solid var(--line);font-weight:700;
  }
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  .row-input{
    width:100%;min-width:80px;padding:6px 2px;border:none;border-bottom:1px solid var(--line-soft);
    background:transparent;font-family:inherit;font-size:12px;color:var(--ink);outline:none;
  }
  .row-input:focus{border-bottom-color:var(--accent);}
  .mini-btn{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:6px 12px;font-family:inherit;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
    cursor:pointer;
  }
  .mini-btn:hover{background:var(--ink);color:var(--paper);}
  .mini-btn.saved{border-color:var(--success);color:var(--success);background:transparent;}
  .mini-btn.full{border-color:var(--accent);color:var(--accent);}
  .empty-row{text-align:center;padding:34px;color:var(--ink-soft);font-size:13.5px;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .filters select, .filters input{
    padding:9px 10px;border:1.5px solid var(--line);background:#F7F5EF;
    font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;
  }

  /* trainee-grouped applications */
  .trainee-block{border:1.5px solid var(--line);margin-bottom:16px;background:var(--paper);}
  .trainee-head{
    padding:14px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
    border-bottom:1.5px solid var(--line);
  }
  .trainee-id{font-family:'Pretendard', sans-serif;font-weight:900;font-size:16px;}
  .trainee-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .rrn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rrn-value{font-family:monospace;font-size:12px;color:var(--ink-soft);}
  .trainee-body{padding:14px 16px;display:flex;gap:24px;flex-wrap:wrap;}
  .memo-col{flex:1;min-width:220px;}
  .memo-col label{
    display:block;font-size:10px;color:var(--ink-soft);margin-bottom:7px;
    letter-spacing:0.1em;text-transform:uppercase;font-weight:700;
  }
  .memo-input{
    width:100%;min-height:70px;padding:11px 12px;border:1.5px solid var(--line-soft);
    background:#F7F5EF;font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;resize:vertical;
  }
  .memo-input:focus{border-color:var(--accent);background:#fff;}
  .apps-col{flex:1.4;min-width:260px;}
  .apps-col label{
    display:block;font-size:10px;color:var(--ink-soft);margin-bottom:7px;
    letter-spacing:0.1em;text-transform:uppercase;font-weight:700;
  }
  .app-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line-soft);
  }
  .app-row:last-child{border-bottom:none;}
  .app-round{font-size:13.5px;font-weight:700;}
  .app-round .type{font-size:10.5px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
  .app-sub{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  .dup-badge{
    display:inline-block;margin-left:7px;padding:1px 7px;border:1px solid var(--line-soft);
    color:var(--ink-soft);font-size:9.5px;letter-spacing:0.04em;
  }
  .cancelled-note{color:var(--accent);}
  select.status-select{
    padding:6px 8px;border:1px solid var(--line);background:transparent;color:var(--ink);
    font-family:inherit;font-size:11.5px;outline:none;
  }
  .status-대기{color:var(--warn);}
  .status-승인{color:var(--success);}
  .status-거절{color:var(--accent);}
  .status-취소{color:var(--muted);}

  @media (max-width:720px){
    .content{padding:20px 14px 64px;}
    th,td{white-space:nowrap;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="kicker">◆ Admin ◆</div>
    <h1>관리자 로그인</h1>
    <div class="sub">재직자 교육 신청 관리</div>
    <label>이메일</label>
    <input type="email" id="loginEmail" placeholder="you@jmbc.co.kr">
    <label>비밀번호</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button id="loginBtn">로그인</button>
    <div class="login-toggle" id="toggleMode">처음이신가요? 계정 만들기</div>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<div id="dashboard">
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="kicker">전주MBC · K-디지털팀</div>
        <h1>재직자 교육 신청 관리</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="who" id="whoAmI"></span>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="panel">
      <h2>과정 · 회차 관리</h2>
      <div class="add-form">
        <div>
          <label>과정명</label>
          <select id="newCourseType"><option value="">과정명 선택</option></select>
        </div>
        <div><label>회차</label><input type="number" id="newRound" placeholder="3" min="1"></div>
        <div><label>시작일</label><input type="date" id="newStartDate"></div>
        <div><label>종료일</label><input type="date" id="newEndDate"></div>
        <div><label>정원</label><input type="number" id="newCapacity" placeholder="30"></div>
        <button id="addRoundBtn">회차 추가</button>
      </div>
      <div id="newTypeRow" class="new-type-row" style="display:none;">
        <label>새 과정명</label>
        <input type="text" id="newTypeName" placeholder="예: 버추얼스튜디오 실무">
      </div>

      <div style="overflow-x:auto;margin-top:22px;">
        <table>
          <thead><tr><th>과정</th><th>회차</th><th>라벨</th><th>시작일</th><th>종료일</th><th>정원</th><th></th></tr></thead>
          <tbody id="roundRows"><tr><td colspan="7" class="empty-row">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>신청 현황</h2>
      <div class="filters">
        <select id="filterStatus">
          <option value="">전체 상태</option>
          <option value="대기">대기</option>
          <option value="승인">승인</option>
          <option value="거절">거절</option>
          <option value="취소">취소</option>
        </select>
        <select id="filterRound"><option value="">전체 회차</option></select>
        <input type="text" id="filterSearch" placeholder="이름/연락처 검색">
      </div>
      <div id="traineeGroups"><div class="empty-row">불러오는 중...</div></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://hazktmyqfizvgwfogqwm.supabase.co";
const SUPABASE_KEY = "sb_publishable_nYc0jVUhe6_mnrEyMG9KKw_uWURS_Mv";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isSignupMode = false;
let allCourseTypes = [];
let allRounds = [];
let allApps = [];

// ---------- auth ----------
document.getElementById('toggleMode').addEventListener('click', () => {
  isSignupMode = !isSignupMode;
  document.getElementById('loginBtn').textContent = isSignupMode ? '계정 만들기' : '로그인';
  document.getElementById('toggleMode').textContent = isSignupMode ? '이미 계정이 있어요' : '처음이신가요? 계정 만들기';
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msgEl = document.getElementById('loginMsg');
  msgEl.textContent = '';
  if (!email || !password){ msgEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }

  const { data, error } = isSignupMode
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });

  if (error){ msgEl.textContent = error.message; return; }
  if (isSignupMode && data.user && !data.session){
    msgEl.style.color = 'var(--success)';
    msgEl.textContent = '이메일 인증 후 로그인해주세요.';
    return;
  }
  showDashboard(data.session?.user);
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function checkExistingSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) showDashboard(data.session.user);
}
checkExistingSession();

function showDashboard(user){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('whoAmI').textContent = user?.email || '';
  loadCourseTypes();
  loadRounds();
  loadApplications();
}

// ---------- course types ----------
async function loadCourseTypes(){
  const { data, error } = await sb.from('course_types').select('*').order('name');
  if (error) return;
  allCourseTypes = data || [];
  const sel = document.getElementById('newCourseType');
  const prev = sel.value;
  sel.innerHTML = '<option value="">과정명 선택</option>' +
    allCourseTypes.map(t => `<option value="${t.id}">${t.name}</option>`).join('') +
    '<option value="__new__">+ 새 과정명 추가</option>';
  sel.value = prev;
}

document.getElementById('newCourseType').addEventListener('change', (e) => {
  document.getElementById('newTypeRow').style.display = e.target.value === '__new__' ? 'block' : 'none';
});

// ---------- rounds ----------
async function loadRounds(){
  const { data, error } = await sb.from('course_rounds').select('*, course_types(name)').order('start_date', { ascending: true });
  if (error) return;
  allRounds = data || [];

  const filterSel = document.getElementById('filterRound');
  filterSel.innerHTML = '<option value="">전체 회차</option>' +
    allRounds.map(r => `<option value="${r.id}">${r.label}</option>`).join('');

  renderRoundRows();
}

function renderRoundRows(){
  const tbody = document.getElementById('roundRows');
  if (allRounds.length === 0){
    tbody.innerHTML = '<tr><td colspan="7" class="empty-row">등록된 회차가 없습니다</td></tr>';
    return;
  }
  tbody.innerHTML = allRounds.map(r => `
    <tr data-round-id="${r.id}">
      <td>${r.course_types?.name || '-'}</td>
      <td><input class="row-input" data-field="round" value="${r.round ?? ''}" style="width:56px;"></td>
      <td><input class="row-input" data-field="label" value="${(r.label||'').replace(/"/g,'&quot;')}"></td>
      <td><input class="row-input" type="date" data-field="start_date" value="${r.start_date || ''}"></td>
      <td><input class="row-input" type="date" data-field="end_date" value="${r.end_date || ''}"></td>
      <td><input class="row-input" data-field="capacity" value="${r.capacity ?? ''}" style="width:56px;"></td>
      <td><button class="mini-btn round-save" data-id="${r.id}">저장</button></td>
    </tr>
  `).join('');

  tbody.querySelectorAll('.round-save').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const row = tbody.querySelector(`tr[data-round-id="${id}"]`);
      const round = row.querySelector('[data-field="round"]').value || null;
      const label = row.querySelector('[data-field="label"]').value.trim();
      const start_date = row.querySelector('[data-field="start_date"]').value || null;
      const end_date = row.querySelector('[data-field="end_date"]').value || null;
      const capacity = row.querySelector('[data-field="capacity"]').value || null;
      if (!label) return;
      btn.textContent = '저장 중';
      const { error } = await sb.from('course_rounds').update({
        round: round ? Number(round) : null, label, start_date, end_date,
        capacity: capacity ? Number(capacity) : null
      }).eq('id', id);
      if (!error){
        btn.textContent = '저장됨'; btn.classList.add('saved');
        setTimeout(() => { btn.textContent = '저장'; btn.classList.remove('saved'); }, 1400);
        loadRounds(); loadApplications();
      } else { btn.textContent = '실패'; }
    });
  });
}

document.getElementById('addRoundBtn').addEventListener('click', async () => {
  const typeSel = document.getElementById('newCourseType').value;
  const round = document.getElementById('newRound').value || null;
  const start_date = document.getElementById('newStartDate').value || null;
  const end_date = document.getElementById('newEndDate').value || null;
  const capacity = document.getElementById('newCapacity').value || null;
  if (!typeSel) return;

  let course_type_id = typeSel;
  let typeName = allCourseTypes.find(t => t.id === typeSel)?.name;

  if (typeSel === '__new__'){
    const newName = document.getElementById('newTypeName').value.trim();
    if (!newName) return;
    const { data, error } = await sb.from('course_types').insert({ name: newName }).select().single();
    if (error) return;
    course_type_id = data.id;
    typeName = data.name;
  }

  const label = round ? `${typeName} ${round}차` : typeName;
  const { error } = await sb.from('course_rounds').insert({
    course_type_id, round: round ? Number(round) : null, label, start_date, end_date, capacity
  });

  if (!error){
    ['newRound','newStartDate','newEndDate','newCapacity','newTypeName'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('newTypeRow').style.display = 'none';
    document.getElementById('newCourseType').value = '';
    loadCourseTypes(); loadRounds();
  }
});

// ---------- applications (grouped by trainee) ----------
async function loadApplications(){
  const { data, error } = await sb
    .from('applications')
    .select('id, status, applied_at, cancelled_at, trainee_id, trainees(id,name,phone,email,company_name,memo), course_rounds(id,label,course_types(name))')
    .order('applied_at', { ascending: false });
  if (error){
    document.getElementById('traineeGroups').innerHTML = `<div class="empty-row">불러오기 실패: ${error.message}</div>`;
    return;
  }
  allApps = data || [];
  renderTraineeGroups();
}

function renderTraineeGroups(){
  const statusFilter = document.getElementById('filterStatus').value;
  const roundFilter = document.getElementById('filterRound').value;
  const search = document.getElementById('filterSearch').value.trim().toLowerCase();

  const groups = new Map();
  allApps.forEach(a => {
    const tId = a.trainee_id;
    if (!groups.has(tId)) groups.set(tId, { trainee: a.trainees, apps: [] });
    groups.get(tId).apps.push(a);
  });

  let entries = Array.from(groups.values()).filter(g => {
    if (search){
      const hay = `${g.trainee?.name || ''} ${g.trainee?.phone || ''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (statusFilter && !g.apps.some(a => a.status === statusFilter)) return false;
    if (roundFilter && !g.apps.some(a => a.course_rounds?.id === roundFilter)) return false;
    return true;
  });

  const container = document.getElementById('traineeGroups');
  if (entries.length === 0){
    container.innerHTML = '<div class="empty-row">해당하는 신청 내역이 없습니다</div>';
    return;
  }

  container.innerHTML = entries.map(g => `
    <div class="trainee-block" data-trainee-id="${g.trainee?.id}">
      <div class="trainee-head">
        <div>
          <div class="trainee-id">${g.trainee?.name || '-'}</div>
          <div class="trainee-meta">${g.trainee?.phone || '-'} ${g.trainee?.email ? '· ' + g.trainee.email : ''} ${g.trainee?.company_name ? '· ' + g.trainee.company_name : ''}</div>
        </div>
        <div class="rrn-row">
          <span class="rrn-value" data-trainee-id="${g.trainee?.id}">●●●●●●-●●●●●●●</span>
          <button class="mini-btn rrn-btn" data-trainee-id="${g.trainee?.id}" data-mode="masked">확인</button>
          <button class="mini-btn rrn-btn full" data-trainee-id="${g.trainee?.id}" data-mode="full">전체보기</button>
        </div>
      </div>
      <div class="trainee-body">
        <div class="memo-col">
          <label>메모 (이 사람 전체 공통)</label>
          <textarea class="memo-input" data-trainee-id="${g.trainee?.id}" placeholder="메모 입력...">${g.trainee?.memo || ''}</textarea>
          <button class="mini-btn memo-save" data-trainee-id="${g.trainee?.id}" style="margin-top:8px;">메모 저장</button>
        </div>
        <div class="apps-col">
          <label>신청 과정 (${g.apps.length}건)</label>
          ${(() => {
            const sorted = [...g.apps].sort((x, y) => new Date(x.applied_at) - new Date(y.applied_at));
            const roundCounts = {};
            const totalByRound = {};
            sorted.forEach(a => { const rid = a.course_rounds?.id || 'unknown'; totalByRound[rid] = (totalByRound[rid] || 0) + 1; });
            return sorted.map(a => {
              const rid = a.course_rounds?.id || 'unknown';
              roundCounts[rid] = (roundCounts[rid] || 0) + 1;
              const isDup = totalByRound[rid] > 1;
              const dateStr = new Date(a.applied_at).toLocaleDateString('ko-KR');
              return `
            <div class="app-row" data-app-id="${a.id}">
              <div>
                <div class="app-round">${a.course_rounds?.label || '-'}<span class="type">${a.course_rounds?.course_types?.name || ''}</span>${isDup ? `<span class="dup-badge">${roundCounts[rid]}번째 신청</span>` : ''}</div>
                <div class="app-sub">신청일 ${dateStr}${a.status === '취소' && a.cancelled_at ? ` · <span class="cancelled-note">취소일 ${new Date(a.cancelled_at).toLocaleDateString('ko-KR')}</span>` : ''}</div>
              </div>
              <select class="status-select status-${a.status}" data-app-id="${a.id}">
                ${['대기','승인','거절','취소'].map(s => `<option value="${s}" ${s===a.status?'selected':''}>${s}</option>`).join('')}
              </select>
            </div>`;
            }).join('');
          })()}
        </div>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.memo-save').forEach(btn => {
    btn.addEventListener('click', async () => {
      const tId = btn.dataset.traineeId;
      const memo = container.querySelector(`.memo-input[data-trainee-id="${tId}"]`).value;
      btn.textContent = '저장 중';
      const { error } = await sb.from('trainees').update({ memo }).eq('id', tId);
      if (!error){
        btn.textContent = '저장됨'; btn.classList.add('saved');
        setTimeout(() => { btn.textContent = '메모 저장'; btn.classList.remove('saved'); }, 1400);
      } else { btn.textContent = '실패'; }
    });
  });

  container.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const appId = sel.dataset.appId;
      const status = sel.value;
      const { error } = await sb.from('applications').update({ status }).eq('id', appId);
      if (!error){
        loadApplications();
      } else {
        sel.className = `status-select status-${sel.dataset.prevStatus || ''}`;
      }
    });
  });

  container.querySelectorAll('.rrn-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const traineeId = btn.dataset.traineeId;
      const mode = btn.dataset.mode;
      const valueEl = container.querySelector(`.rrn-value[data-trainee-id="${traineeId}"]`);
      if (mode === 'full'){
        if (!confirm('주민등록번호 전체를 조회합니다. 이 열람 기록은 감사 로그에 남습니다. 계속할까요?')) return;
      }
      const fn = mode === 'full' ? 'get_trainee_rrn_full' : 'get_trainee_rrn_masked';
      const { data, error } = await sb.rpc(fn, { p_trainee_id: traineeId });
      if (!error && data){ valueEl.textContent = data; }
      else { valueEl.textContent = '조회 실패'; }
    });
  });
}

document.getElementById('filterStatus').addEventListener('change', renderTraineeGroups);
document.getElementById('filterRound').addEventListener('change', renderTraineeGroups);
document.getElementById('filterSearch').addEventListener('input', renderTraineeGroups);
</script>
</body>
</html>
